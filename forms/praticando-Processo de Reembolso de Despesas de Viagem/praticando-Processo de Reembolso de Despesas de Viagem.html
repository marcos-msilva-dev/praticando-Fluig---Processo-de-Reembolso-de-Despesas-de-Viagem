<html>
<head>
	<link type="text/css" rel="stylesheet" href="/style-guide/css/fluig-style-guide-flat.min.css"/>
	<script type="text/javascript" src="/portal/resources/js/jquery/jquery.js"></script>
	<script type="text/javascript" src="/portal/resources/js/jquery/jquery-ui.min.js"></script>
	<script type="text/javascript" src="/portal/resources/js/mustache/mustache-min.js"></script>
	<script type="text/javascript" src="/style-guide/js/fluig-style-guide.min.js" charset="utf-8"></script>
	
</head>
<body>
	<div class="fluig-style-guide">
		<form name="form" role="form">
			<div class="page-header">
				<h1>Processo de Reembolso de Despesas de Viagem</h1>
			</div>
			<div class="panel panel-primary">
				<div class="panel-heading">
					<h3 class="panel-title" style="display: flex; align-items: center; gap: 8px;"><i class="flaticon flaticon-person icon-xl" aria-hidden="true"></i><span>Informações do solicitante</span></h3>
				</div>
				<div class="panel-body">
					<div class="row">
						<!-- Painel (panel-default) com o título do processo e dados do solicitante 
						(nome, e-mail, data de solicitação e departamento). -->
						<div class="form-group col-md-3">
							<label for="nome">Nome:</label>
							<input type="text" class="form-control" id="nome" name="nome" placeholder="Digite seu nome">
						</div>
						<div class="form-group col-md-3">
							<label for="email">E-mail:</label>
							<input type="email" class="form-control" id="email" name="email" placeholder="Digite seu e-mail">
						</div>
						<div class="form-group col-md-3">
							<label for="dataSolicitacao">Data de Solicitação:</label>
							<input type="text" class="form-control" id="dataSolicitacao" name="dataSolicitacao">
						</div>
						<div class="form-group col-md-3">
							<label for="departamento">Departamento:</label>
							<input type="text" class="form-control" id="departamento" name="departamento" placeholder="Digite seu departamento">
						</div>
					</div>
				</div>
			</div>
			<div class="panel panel-primary">
				<div class="panel-heading">
					<h3 class="panel-title" style="display: flex; align-items: center; gap: 8px;"><i class="flaticon flaticon-flight icon-xl" aria-hidden="true"></i><span>Dados da Viagem</span></h3>
				</div>
				<div class="panel-body">
					<div class="row">
						<!-- Inputs para: Motivo da Viagem, Centro de Custo, e um campo Zoom consumindo
						o Dataset nativo de usuários (colleague) para selecionar o Gestor Aprovador. -->
						<div class="form-group">
							<label for="motivoViagem">Motivo da viagem</label>
							<textarea rows='5' class="form-control col-md-12" id="motivoViagem" name="motivoViagem" placeholder="Digite o motivo da viagem"></textarea>
						</div>
					</div>
					<div class="row">
						<div class="col-md-4">
							<div class="form-group">
								<label for="usuarioAprovador">Gestor aprovador</label>
								<input type="zoom" class="form-control" id="usuarioAprovador" name="usuarioAprovador" data-zoom="{
									'datasetId':'colleague',
									'displayKey':'colleagueName',
									'maximumSelectionLength':'1',
									'placeholder':'Selecione um gestor aprovador',
									'fields':[
										{
											'field':'colleagueName',
											'label':'Nome',
											'standard':'true'
										},
										{
											'field':'colleagueId',
											'label':'Id',
											'visible': 'false'
										}
									]
								}">
							</div>
						</div>
					</div>
				</div>
			</div>

			<div class="panel panel-primary">
				<div class="panel-heading">
					<h3 class="panel-title" style="display: flex; align-items: center; gap: 8px;"><i class="flaticon flaticon-monetization-on icon-thumbnail-xs" aria-hidden="true"></i><span>Tabela de Despesas</span></h3>
				</div>
				<div class="panel-body">
					<!-- Tabela de Despesas	Uma tabela Pai e Filho (tablename="despesasTable")
					contendo:
					• Tipo de Despesa (Select: Alimentação, Hospedagem, Transporte, Outros)
					• Data da Despesa (Input com calendário Fluig Style Guide FLG-datepicker)
					• Valor da Despesa (Input formatado com máscara de moeda)• Comprovante (Input file ou campo texto para anexo) -->
					<table id="despesasTable" tablename="despesasTable" class="table table-hover" noaddbutton="true" nodeletebutton="true">
						<thead>
							<tr>
								<th>Tipo de despesa</th>
								<th>Data da despesa</th>
								<th>Valor da despesa</th>
							</tr>
						</thead>
						<tbody>
							<tr>
								<td>
									<select class="form-control" name="tipoDespesa">
										<option value="Alimentação">Alimentação</option>
										<option value="Hospedagem">Hospedagem</option>
										<option value="Transporte">Transporte</option>
										<option value="Outros">Outros</option>
									</select>
								</td>
								<td>
									<div class="input-group">
										<input type="text" name="txtDataDespesa" class="form-control campo-data">
										<span class="input-group-addon">
											<span class="fluigicon fluigicon-calendar"></span>
										</span>
									</div>
								</td>
								<td>
									<div class="form-group">
										<input type="number" class="form-control" name="valorDespesa" placeholder="R$ 0,00">										
									</div>
								</td>
								<td>
									<button type="button" style="height: 32px; display: flex; align-items: center; justify-items: center;" class="btn btn-danger" onclick="fnWdkRemoveChild(this)">
										<i class="flaticon flaticon-trash icon-sm" aria-hidden="true"></i>
									</button>
								</td>
							</tr>
						</tbody>
					</table>
					<button type="button" class="btn btn-primary" id="addDespesa" onclick="adicionarDespesa()">Adicionar Despesa</button>
				</div>
			</div>
		</form>
	</div>
	<script src="custom.js"></script>
</body>
<script type="text/javascript">
	var dataSolicitacao = FLUIGC.calendar('#dataSolicitacao');
</script>
</html>
